# vNext Pipeline Runbook
# Implements PRD vNext architecture: gate drives filtered corpus
# 
# Key differences from full-pipeline:
# - Step 4 (assemble_corpus) builds FULL_MODEL_TEXT from gated chunks
# - Extract step uses filtered corpus, not full source
# - Step 10 (emit_candidates) creates deterministic candidate notes (no LLM)
#
# Milestones:
# M1 ✓ Gate drives filtered corpus
# M2 ✓ Incubator + deterministic stubs
# M3   Chunk-centric bundle modeling (future)

runbook_id: vnext-pipeline
version: "1.1"
description: vNext pipeline - gate + incubator (M1+M2)

globals:
  token_budget: 100000
  cost_ceiling: 5.00
  time_ceiling_seconds: 600

steps:
  # Step 1: Ingest source file and create source anchor
  - id: ingest
    type: ingest
    inputs:
      file: "{{file}}"

  # Step 2: Split content into semantic chunks
  - id: chunk
    type: chunk
    inputs:
      file: "{{file}}"
    decision_points:
      - name: chunkSize
        allowed:
          min: 1500
          max: 4000
        objective: semantic_coherence
        guardrails:
          max_chunks: 20

  # Step 3: Gate chunks (classify with Azure GPT-5-nano)
  - id: gate
    type: gate
    inputs:
      chunks: "from_context"
    decision_points:
      - name: strictness
        allowed:
          - lenient
          - balanced
          - strict
        objective: balanced_filtering

  # Step 4: Assemble filtered corpora (M1)
  # Builds FULL_MODEL_TEXT and LIGHT_SCAN_TEXT from gated chunks
  - id: assemble_corpus
    type: assemble_corpus
    # sourceId comes from context automatically (chunk step output)

  # Step 5: Extract knowledge candidates from FILTERED corpus
  # Uses fullModelText from assemble_corpus (comes from context)
  - id: extract
    type: extract_filtered
    inputs:
      file: "{{file}}"

  # Step 6: Resolve candidates against existing vault (deduplication)
  - id: resolve
    type: resolve

  # Step 7: Model notes from candidates with verification loop
  - id: model
    type: model
    decision_points:
      - name: model_depth
        allowed:
          options:
            - shallow
            - standard
            - deep
        objective: quality

  # Step 8: Final verification of all notes
  - id: verify
    type: verify

  # Step 9: Resolve wikilinks
  - id: link
    type: link

  # Step 10: Emit candidates to incubator (M2)
  # Creates deterministic candidate notes from LINK_INTENTS - no LLM
  - id: emit_candidates
    type: emit_candidates
    # notes come from model step context

  # Step 11: Build vault index
  - id: index
    type: index

  # Step 11: Generate story for primary concept (optional)
  - id: story
    type: story
    conditions:
      has_concepts: true

evaluations:
  model:
    notes_created: 1
  verify:
    pass_rate: 0.8

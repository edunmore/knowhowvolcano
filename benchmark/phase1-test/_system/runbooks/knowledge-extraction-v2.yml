# Enhanced Knowledge Extraction Runbook
# With prompt templates, output schemas, and link rules

runbook_id: knowledge-extraction-enhanced
version: "2.0"
description: Extract educational knowledge with Zettelkasten linking

# What to achieve
goals:
  - Extract all knowledge types (concepts, procedures, principles, misconceptions, examples)
  - Create inline [[wikilinks]] for related terms
  - Generate LINK_INTENTS metadata with stub policies
  - Verify all notes are grounded in source evidence

# Boundaries
constraints:
  max_tokens: 100000
  max_cost_usd: 5.00
  max_retries: 3
  min_verification_pass_rate: 0.8

# Prompt configuration
prompts:
  coordinator: "_system/prompts/prompt-coordinator.md"
  linking_rules: "_system/prompts/prompt-linking-rules.md"
  
# Output schema
output:
  note_types:
    - concept       # Definitions, frameworks, models
    - procedure     # Step-by-step processes
    - principle     # Rules, heuristics, guidelines
    - misconception # Common wrong beliefs
    - example       # Scenarios, case studies
  
  required_fields:
    all:
      - id
      - type
      - title
    concept:
      - definition
      - key_points
      - evidence
      - link_intents
    procedure:
      - steps
      - when_to_use
    principle:
      - definition
      - key_points
    misconception:
      - misconception
      - correction
    example:
      - scenario
      - key_insight

# Link rules
linking:
  inline_links: true
  link_intents_required: true
  stub_policies:
    - create_with_ai_explanation  # confidence >= 0.65
    - create_empty                # 0.35 <= confidence < 0.65
    - ignore                      # confidence < 0.35
  
  link_types:
    - concept
    - glossary
    - metaphor_construct
    - prerequisite
    - author
    - metric
    - tool

# Validation rules
validation:
  enabled: true
  rules:
    - note_type_must_be_registered
    - required_fields_must_be_present
    - link_intents_must_match_inline_links
    - stub_policy_must_be_valid
    - confidence_must_be_between_0_and_1

# Post-processing
post_process:
  - action: resolve_links
    tool: "resolve-links.ts"
  - action: update_index
    files:
      - "_index/stubs.json"
      - "_index/links.json"

# Preferences
preferences:
  target_notes_per_run: [5, 10]
  skip_types:
    - table_of_contents
    - legal_disclaimer
    - author_bio
    - acknowledgments

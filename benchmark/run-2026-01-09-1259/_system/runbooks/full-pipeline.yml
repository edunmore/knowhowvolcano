# Full Pipeline Runbook
# Complete ingest → chunk → gate → extract → model → verify → link → index workflow
# This is THE runbook for full knowledge extraction
#
# NOTE: Step outputs are merged into a shared context. Each step can access
# previous step outputs directly by name (e.g., 'sourceContent' not '$chunk.sourceContent')

runbook_id: full-pipeline
version: "2.0"
description: Complete knowledge extraction pipeline with all agents

globals:
  token_budget: 100000
  cost_ceiling: 5.00
  time_ceiling_seconds: 600

steps:
  # Step 1: Ingest source file and create source anchor
  - id: ingest
    type: ingest
    inputs:
      file: "{{file}}"

  # Step 2: Split content into semantic chunks
  - id: chunk
    type: chunk
    inputs:
      file: "{{file}}"
    decision_points:
      - name: chunkSize
        allowed:
          min: 1500
          max: 4000
        objective: semantic_coherence
        guardrails:
          max_chunks: 20

  # Step 3: Gate chunks (classify with Azure GPT-5-nano)
  - id: gate
    type: gate
    inputs:
      chunks: "from_context"
    decision_points:
      - name: strictness
        allowed:
          - lenient
          - balanced
          - strict
        objective: balanced_filtering

  # Step 4: Extract knowledge candidates from source
  # Uses sourceContent and sourceId from chunk step (auto-merged into context)
  - id: extract
    type: extract
    inputs:
      file: "{{file}}"

  # Step 5: Resolve candidates against existing vault (deduplication)
  # Uses candidates from extract step (auto-merged into context)
  - id: resolve
    type: resolve

  # Step 6: Model notes from candidates with verification loop
  # Uses candidates, resolutionMap, sourceContent from context
  - id: model
    type: model
    decision_points:
      - name: model_depth
        allowed:
          options:
            - shallow
            - standard
            - deep
        objective: quality

  # Step 7: Final verification of all notes
  - id: verify
    type: verify

  # Step 8: Resolve wikilinks and create stubs
  - id: link
    type: link

  # Step 9: Build vault index
  - id: index
    type: index

  # Step 10: Generate story for primary concept (optional)
  - id: story
    type: story
    conditions:
      has_concepts: true

evaluations:
  model:
    notes_created: 1
  verify:
    pass_rate: 0.8

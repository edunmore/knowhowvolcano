# Chunk-Only Runbook
# Tests chunking without any LLM calls

runbook_id: chunk-only
version: "1.0"
description: Chunk file(s) into vault storage without LLM calls

# No budget constraints - decision points will use LLM
globals: {}

steps:
  - id: chunk
    type: chunk
    inputs:
      file: "{{file}}"
      dir: "{{dir}}"
    decision_points:
      - name: chunkSize
        allowed:
          min: 2000
          max: 8000
        objective: balanced_coverage
        guardrails:
          max_chunks: 100

# vNext Pipeline Runbook v2.0
# Phase 1 Complete - Implements all discussed improvements
# 
# Changes from v1.2:
# - Removed assemble_corpus step (sliding windows handle this)
# - Removed separate extract/resolve/model steps
# - model_bundle does extract+model in one pass via sliding windows
# - Hardcoded chunkSize (no LLM decision needed)
# - Fast mode: sources < 10kb skip gating entirely
# - Stubs go to stubs/ folder (not concepts/)
#
# Milestones (all implemented):
# M1 ✓ Gate drives filtered corpus (+ fast mode)
# M2 ✓ Incubator + stubs/ folder
# M3 ✓ Chunk-centric bundle modeling (model_bundle)
# M4 ✓ Verification optimization (verified:true skipping)
# M5 ✓ Emergent Zettelkasten artifacts

runbook_id: vnext-pipeline
version: "2.0"
description: vNext pipeline - Phase 1 Complete

globals:
  token_budget: 100000
  cost_ceiling: 5.00
  time_ceiling_seconds: 1200

steps:
  # Step 1: Ingest source file
  - id: ingest
    type: ingest
    inputs:
      file: "{{file}}"

  # Step 2: Chunk (hardcoded size, no LLM decision)
  - id: chunk
    type: chunk
    inputs:
      file: "{{file}}"
      chunkSize: 2500  # Hardcoded - no LLM call needed

  # Step 3: Gate (with fast mode for small sources)
  # Sources < 10kb skip gating entirely
  # Auto-skips ToC, Note to Reader, Acknowledgments, etc.
  - id: gate
    type: gate
    inputs:
      chunks: "from_context"

  # Step 4: Model Bundle (sliding windows)
  # Does extract+model in one pass per window
  # Caps notes per chunk at 5
  - id: model_bundle
    type: model_bundle
    inputs:
      max_notes_per_chunk: 5

  # Step 5: Verify (M4 - skips already verified notes)
  - id: verify
    type: verify

  # Step 6: Link (creates stubs in stubs/ folder)
  - id: link
    type: link

  # Step 7: Emit candidates to incubator (M2)
  - id: emit_candidates
    type: emit_candidates

  # Step 8: Emergent artifacts (M5)
  - id: emergent_artifacts
    type: emergent_artifacts

  # Step 9: Build vault index
  - id: index
    type: index

evaluations:
  model_bundle:
    notes_created: 1
  verify:
    pass_rate: 0.8

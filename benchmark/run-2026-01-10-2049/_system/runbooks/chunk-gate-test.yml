# Chunk + Gate Test Runbook
# Tests chunking and gating with Azure GPT-5-nano

runbook_id: chunk-gate-test
version: "1.0"
description: Test chunking with small chunks and verify Azure GPT-5-nano gating

globals: {}

steps:
  - id: chunk
    type: chunk
    inputs:
      file: "{{file}}"
    decision_points:
      - name: chunkSize
        allowed:
          min: 1200
          max: 2000
        objective: create_multiple_chunks
        guardrails:
          max_chunks: 50

  - id: gate
    type: gate
    inputs:
      chunks: "$chunk.chunks"
    decision_points:
      - name: strictness
        allowed:
          - lenient
          - balanced
          - strict
        objective: balanced_filtering

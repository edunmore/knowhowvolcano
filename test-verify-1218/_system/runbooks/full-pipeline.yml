# Full Pipeline Runbook
# Complete ingestion workflow with agentic decision-making

runbook_id: full-pipeline
version: "1.0"
description: Complete ingest → extract → model → index → story pipeline

globals:
  token_budget: 100000
  cost_ceiling: 5.00
  time_ceiling_seconds: 600

steps:
  - id: ingest
    type: ingest
    inputs:
      file: "{{file}}"

  - id: chunk
    type: chunk
    decision_points:
      - name: chunkSize
        allowed:
          min: 2000
          max: 6000
        objective: coverage_f1
        guardrails:
          max_chunks: 50

  - id: gate
    type: gate
    decision_points:
      - name: relevance_threshold
        allowed:
          min: 0.3
          max: 0.8
        objective: precision

  - id: extract
    type: extract

  - id: resolve
    type: resolve

  - id: model
    type: model
    decision_points:
      - name: model_depth
        allowed:
          options:
            - shallow
            - standard
            - deep
        objective: accuracy

  - id: verify
    type: verify

  - id: link
    type: link

  - id: index
    type: index

  - id: story
    type: story
    conditions:
      has_concepts: true

evaluations:
  model:
    min_notes_created: 1
  verify:
    pass_rate: 0.8
